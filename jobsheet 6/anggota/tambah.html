<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>

</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <button id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota</h2>
            <form id="form-tambah" action="list.html" method="GET" novalidate>
                <p>
                    <label for="nim">NIM</label><br>
                    <input type="text" id="nim" name="nim" placeholder="Masukkan NIM Anggota" required>
                </p>
                <p>
                    <label for="nama">Nama Lengkap</label><br>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap" required>
                </p>
                <p>
                    <label for="prodi">Program Studi</label><br>
                    <input type="text" id="prodi" name="prodi" placeholder="Masukkan Program Studi" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" placeholder="Masukkan Alamat Email" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>

    <script src="../assets/js/app.js"></script>
