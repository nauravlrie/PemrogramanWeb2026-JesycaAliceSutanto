<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Login Petugas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <button id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="buku/list.html">Daftar Buku</a></li>
                <li><a href="anggota/list.html">Daftar Anggota</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Login Petugas</h2>
            <form action="index.html" method="GET">
                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </p>
                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>
            <p style="margin-top: 1rem; font-size: 0.9rem;">
                Belum punya akun? <a href="#">Daftar di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Sistem Informasi Perpustakaan Sederhana</p>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
